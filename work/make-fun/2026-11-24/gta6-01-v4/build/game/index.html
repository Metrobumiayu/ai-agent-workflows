<title>Vice Bay — A Grand Theft Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d17; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #help { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); color: rgba(255,255,255,0.65);
    font: 12px monospace; background: rgba(0,0,0,0.45); padding: 4px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Bay: steal cars, run missions, lose the cops, take the city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="help">WASD drive/walk &nbsp;·&nbsp; E enter car / use / mission &nbsp;·&nbsp; Mouse aim, click shoot &nbsp;·&nbsp; SPACE handbrake &nbsp;·&nbsp; 1–5 weapons &nbsp;·&nbsp; R radio &nbsp;·&nbsp; P pause &nbsp;·&nbsp; H save &nbsp;·&nbsp; M missions</div>
<script type="module" src="./src/main.js"></script>
