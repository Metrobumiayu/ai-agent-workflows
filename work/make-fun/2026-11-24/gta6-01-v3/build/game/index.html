<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — an open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;background:#0b1020;height:100%;overflow:hidden;font-family:Verdana,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1020}
  canvas{display:block;background:#1c2b1a;max-width:100vw;max-height:100vh;image-rendering:auto}
  #err{position:fixed;left:8px;bottom:8px;color:#f66;font:12px monospace;white-space:pre-wrap;max-width:60vw}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="err"></div>
<script type="module" src="./src/main.js"></script>
<script>
window.addEventListener('error',e=>{var d=document.getElementById('err');d.textContent+=(d.textContent?'\n':'')+'ERR: '+e.message;});
</script>
</body>
</html>
